name: Package V8.14.1 release branch
on:
  push:
    branches: [release/v8141]
    paths: ['.github/workflows/package-v8141.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          node scripts/build-v8.cjs
          git add -A -- assets v8.html release-integrity.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Package verified V8.14.1 source for the existing app URL'
          git push origin HEAD:refs/heads/release/v8141
