name: V8.10 acceptance and release
on:
  push:
    branches: [v8-10-session-flow, main]
    paths-ignore: ['data/**']
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: v810-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: tt810
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run check && npm test && npm run test:v8
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm audit --omit=dev --audit-level=high
      - name: PostgreSQL 17 lifecycle and isolation acceptance
        env:
          PGPASSWORD: isolated-test-only
        run: |
          python3 scripts/prepare-v810-sql-test.py
          psql -h 127.0.0.1 -U postgres -d tt810 -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_v810.sql
          psql -h 127.0.0.1 -U postgres -d tt810 -v ON_ERROR_STOP=1 -f /tmp/tt810-baseline.sql
          psql -h 127.0.0.1 -U postgres -d tt810 -v ON_ERROR_STOP=1 -c 'GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO authenticated;'
          for file in sql/security_v735.sql sql/review_types_v735.sql sql/training_focus_v735.sql sql/flow_v736.sql sql/ratings_v737.sql sql/idea_learning_v740.sql sql/guided_flow_v741.sql db/v8_htf_learning.sql db/v8_08_preparation.sql db/v8_09_learning.sql db/v8_10_session_lifecycle.sql tests/sql/verify_v810.sql; do psql -h 127.0.0.1 -U postgres -d tt810 -v ON_ERROR_STOP=1 -f "$file"; done
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile real browser acceptance
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tt810-http.log 2>&1 &
          node scripts/test-v809-browser.cjs
          node scripts/test-v810-browser.cjs
      - name: Package complete versioned source
        run: |
          git archive --format=zip --prefix=TradingTerminator_V8.10/ --output=TradingTerminator_V8.10.zip HEAD
          sha256sum TradingTerminator_V8.10.zip > TradingTerminator_V8.10.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: TradingTerminator-V8.10
          path: |
            TradingTerminator_V8.10.zip
            TradingTerminator_V8.10.sha256
            evidence/v810-*.png
      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v8.10 TradingTerminator_V8.10.zip TradingTerminator_V8.10.sha256 --target "$GITHUB_SHA" --title 'TradingTerminator V8.10' --notes-file docs/V8_10_RELEASE.md
      - name: Verify live version and file checksums
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-v810-live.cjs
